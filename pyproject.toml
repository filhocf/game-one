[project]
name = "game-one"
version = "0.4.0"
description = "Descoberta de padrões em loterias da Caixa — ML, caos programático e TUI"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "scipy>=1.12",
    "textual>=1.0",
]

[project.scripts]
game-one = "game_one.cli:main"

[project.optional-dependencies]
symbolic = ["pysr>=0.19"]
